[project]
name = "crypttrace"
dynamic = ["version"]
description = "OSINT toolkit for crypto investigations: trace stolen funds across Ethereum, Bitcoin, Tron and Solana"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "bobslayerX" }]
requires-python = ">=3.9"
keywords = ["osint", "blockchain", "forensics", "cryptocurrency", "bitcoin", "ethereum", "tron", "solana", "investigation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Legal Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "requests>=2.31",
]

[project.optional-dependencies]
web = ["flask>=3.0"]

[project.urls]
Homepage = "https://github.com/bobslayerX/crypttrace"
Issues = "https://github.com/bobslayerX/crypttrace/issues"
Changelog = "https://github.com/bobslayerX/crypttrace/blob/main/CHANGELOG.md"

[project.scripts]
crypttrace = "crypttrace.cli:app"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "crypttrace.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crypttrace = ["web/*.html", "labels/*.json"]
