name: publish

# Publishing a GitHub release uploads that version to PyPI. No token is stored
# here: PyPI trusts this workflow directly ("trusted publishing"), which has to
# be enabled once on pypi.org for the project.
on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
